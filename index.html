<!DOCTYPE html>

<html>

<head>
  <link
rel="manifest"
href="manifest.json"
>
<meta charset="UTF-8">

<title>Meu Ticket</title>

<style>

body {
    font-family: Arial;
    background: #eeeeee;
    padding: 20px;
}

.app {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 15px;
    box-sizing: border-box;
    font-size: 20px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    background: black;
    color: white;
    border: none;
    font-size: 18px;
    border-radius: 10px;
}

.card {
    background: #f5f5f5;
    padding: 15px;
    margin-top: 15px;
    border-radius: 15px;
}

.numero {
    font-size: 28px;
    font-weight: bold;
}

</style>

</head>


<body>


<div class="app">


<h1>🎯 Meu Ticket</h1>


<div class="card">

<strong>
Ticket objetivo
</strong>

<div class="numero">

R$ 42,90

</div>

</div>

<div class="card">

<strong>
Adicionar comanda
</strong>


<input
id="valorComanda"
type="number"
step="0.01"
placeholder="Digite o valor"
>


<button
id="botao"
>

ADICIONAR COMANDA

</button>

</div>


<div class="card">

<strong>
Total vendido
</strong>

  
<div
id="total"
class="numero"
>

R$ 0,00

</div>

</div>


<div class="card">

<strong>
Comandas
</strong>

<div
id="comandas"
class="numero"
>

0

</div>

</div>


<div class="card">

<strong>
Ticket médio
</strong>

<div
id="ticket"
class="numero"
>

R$ 0,00

</div>

</div>


<div class="card">

<strong>
Situação
</strong>

<div
id="situacao"
class="numero"
>

Aguardando comanda...

</div>

</div>


  <div class="card">

<strong>
Diferença para a meta
</strong>

<div
id="diferenca"
class="numero"
>

R$ 0,00

</div>

</div>

</div>


<script>


let total = 0;

let quantidade = 0;
  
  
  
  
  
  

document
.getElementById("botao")
.addEventListener(
    "click",
    adicionarComanda
);


function adicionarComanda() {


    let campo =
        document.getElementById(
            "valorComanda"
        );


    let valor =
        parseFloat(
            campo.value
        );


    if (
        isNaN(valor) ||
        valor <= 0
    ) {

        alert(
            "Digite um valor válido."
        );

        return;

    }


    total =
        total + valor;


    quantidade =
        quantidade + 1;


    let ticket =
        total / quantidade;


    document
    .getElementById("total")
    .innerText =
        "R$ " +
        total.toFixed(2);


    document
    .getElementById("comandas")
    .innerText =
        quantidade;


    document
    .getElementById("ticket")
    .innerText =
        "R$ " +
        ticket.toFixed(2);


    let situacao =
        document
        .getElementById("situacao");
    let diferenca =
    ticket - 36.92;
document
.getElementById("diferenca")
.innerText =
    "R$ " +
    diferenca.toFixed(2);

    if (
        ticket >= 36.92
    ) {

        situacao.innerText =
            "🟢 DENTRO DA META";

    } else {

        situacao.innerText =
            "🔴 ABAIXO DA META";

    }


    campo.value = "";

}

</script>
<script>

if (
    "serviceWorker" in navigator
) {

    navigator
    .serviceWorker
    .register(
        "service-worker.js"
    );

}

</script>

</body>

</html>
